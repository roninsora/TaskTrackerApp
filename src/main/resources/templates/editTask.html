<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Edit Task</title>
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <div class="container">
            <div>
                <a th:href="@{/}" class="btn-secondary">🏠 Home</a>
                <a th:href="@{/web/task-lists/{taskListId}(taskListId=${taskListId})}">&larr; Cancel</a>
            </div>

            <h2>Edit Task</h2>
            <form
                    th:action="@{/web/task-lists/{taskListId}/tasks/{taskId}/edit(taskListId=${taskListId}, taskId=${task.id})}"
                    th:object="${task}" method="post">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" th:field="*{title}" required autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" th:field="*{description}" autocomplete="off" />
                </div>
                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" th:field="*{priority}">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}">
                        <option value="OPEN">Open</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit">Save Changes</button>
                </div>
            </form>
        </div>
    </body>
</html>
